# One-time migration for the 2026-09-15 unit rename:
#   pneuma-omarchy-setup.service     -> pneuma-skel-seed.service
#   pneuma-omarchy-autologin.service -> pneuma-greeter-setup.service
#
# `systemctl enable` writes its wants-symlink into /etc, which is machine-local
# state that survives the ostree 3-way merge. The units those two symlinks point
# at left with /usr, so without this systemd warns about a missing unit on every
# boot of a machine that ran an older image.
#
# Delete this file once every machine tracking :stable has booted past it.
r /etc/systemd/system/graphical.target.wants/pneuma-omarchy-setup.service
r /etc/systemd/system/graphical.target.wants/pneuma-omarchy-autologin.service
