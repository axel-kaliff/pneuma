# Pneuma system-wide key remaps. keyd operates at the evdev layer, so
# these apply in every session type: Hyprland, GNOME, and virtual consoles.
#
# Apply config edits with: sudo keyd reload

[ids]
*

[main]
# Caps Lock acts as Control
capslock = layer(control)

[control]
# Control+[ (Caps+[ included) sends Escape. "leftbrace" is keyd's name for
# the [ key — a literal "[" at line start would parse as a section header.
leftbrace = esc
