---
name: Sync base image

# Keeps the Containerfile's base-image digest pin level with the tag it names.
#
# The pin is what makes a pneuma build reproducible, but a pin nobody moves is
# a frozen OS: ublue-os/bluefin-dx:lts-hwe sat unrebuilt from 2026-07-14 while
# every pneuma build kept layering onto it. This job resolves the tag daily,
# rewrites the pin when upstream has rebuilt, and opens a self-merging PR so
# the new base actually reaches :stable-testing.
#
# main's branch protection rejects direct pushes, so the bump goes through a
# PR that auto-merges once validate passes. It uses a GitHub App token because
# GITHUB_TOKEN events trigger neither validate on the PR nor push workflows on
# main. The App needs Contents and Pull requests read & write, its Client ID in
# variable APP_CLIENT_ID, and its key in secret APP_PRIVATE_KEY.
# To undo a bad base, revert the chore(base) commit.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-base-image
  cancel-in-progress: false

jobs:
  sync:
    name: Bump the base image pin
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve the tag behind the pin
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          pinned=$(grep -oP '^FROM \K\S+@sha256:[0-9a-f]{64}' Containerfile)
          repo_tag="${pinned%@*}"
          old_digest="${pinned#*@}"
          echo "Pinned: ${repo_tag}@${old_digest}"

          if [[ "${repo_tag}" != ghcr.io/* ]]; then
            echo "::error::Only ghcr.io bases are resolvable here, got ${repo_tag}"
            exit 1
          fi
          path="${repo_tag#ghcr.io/}"
          name="${path%:*}"
          tag="${path##*:}"

          token=$(curl -fsSL --max-time 30 \
            "https://ghcr.io/token?scope=repository:${name}:pull" | jq -er .token)

          new_digest=$(curl -fsSI --max-time 30 \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${name}/manifests/${tag}" \
            | grep -i '^docker-content-digest:' | cut -d' ' -f2 | tr -d '\r')

          if [[ ! "${new_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::${repo_tag} did not resolve to a digest (got '${new_digest}')"
            exit 1
          fi
          echo "Upstream: ${repo_tag}@${new_digest}"

          {
            echo "repo_tag=${repo_tag}"
            echo "old_digest=${old_digest}"
            echo "new_digest=${new_digest}"
            echo "changed=$([[ "${new_digest}" == "${old_digest}" ]] && echo false || echo true)"
          } >> "${GITHUB_OUTPUT}"

      - name: Open a self-merging PR for the new pin
        if: steps.resolve.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_TAG: ${{ steps.resolve.outputs.repo_tag }}
          OLD_DIGEST: ${{ steps.resolve.outputs.old_digest }}
          NEW_DIGEST: ${{ steps.resolve.outputs.new_digest }}
        run: |
          set -euo pipefail
          sed -i "s|^FROM ${REPO_TAG}@${OLD_DIGEST}$|FROM ${REPO_TAG}@${NEW_DIGEST}|" Containerfile
          git diff --exit-code Containerfile && { echo "::error::pin rewrite matched nothing"; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C auto/sync-base-image
          git commit -m "chore(base): ${REPO_TAG##*/} ${NEW_DIGEST:7:12}" Containerfile
          git push --force origin auto/sync-base-image

          pr=$(gh pr list --head auto/sync-base-image --state open \
            --json number --jq '.[0].number // empty')
          if [[ -z "${pr}" ]]; then
            gh pr create --base main --head auto/sync-base-image \
              --title "chore(base): ${REPO_TAG##*/} ${NEW_DIGEST:7:12}" \
              --body "Upstream rebuilt ${REPO_TAG}; this moves the pin from ${OLD_DIGEST} to ${NEW_DIGEST}. This PR squash-merges itself once validate passes."
            gh pr merge auto/sync-base-image --auto --squash
          fi

      - name: Summary
        shell: bash
        env:
          REPO_TAG: ${{ steps.resolve.outputs.repo_tag }}
          NEW_DIGEST: ${{ steps.resolve.outputs.new_digest }}
          CHANGED: ${{ steps.resolve.outputs.changed }}
        run: |
          if [[ "${CHANGED}" == "true" ]]; then
            echo "Pushed ${REPO_TAG}@${NEW_DIGEST} to auto/sync-base-image; the PR squash-merges itself once validate passes." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "${REPO_TAG} is already pinned to the current digest." >> "${GITHUB_STEP_SUMMARY}"
          fi
